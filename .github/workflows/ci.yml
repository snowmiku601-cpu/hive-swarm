name: Runtime and package qualification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '24.2.0', '24.x', 'lts/*']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:dsh
      - run: npm test
      - run: npm run pack:core -- .tmp/ci-artifacts
      - run: npm run pack:dsh -- .tmp/ci-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            .tmp/ci-artifacts/**/*.tgz
            .tmp/**/*.log
          if-no-files-found: ignore
          include-hidden-files: true
